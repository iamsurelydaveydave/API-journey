# fly.toml
app = 'api-journey'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080          # keep this
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'              # clean up the conflicting memory lines
  cpu_kind = 'shared'
  cpus = 1
