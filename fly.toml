# fly.toml app configuration file generated for api-journey on 2026-09-22T20:53:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'api-journey'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
